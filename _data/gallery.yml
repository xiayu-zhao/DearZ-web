# Gallery tiles, shown in this order (two equal 16:9 tiles per row on desktop).
# To add art: drop a full-size image (~1600–2000px wide JPG) and a ~960px thumbnail into /assets/img,
# then add an entry here. Entries with `placeholder: true` show as "in progress" tiles —
# replace them as real art arrives. Keep an even number of tiles so the last row is full.

- title: Bridge to the Afterlife
  title_cn: 往生桥
  caption: Chapter 1 key art — the lantern-bearer, the rope bridge, and Z scattering into nine threads of light.
  src: /assets/img/ch1-bridge-to-the-afterlife.jpg
  thumb: /assets/img/ch1-bridge-to-the-afterlife-960.jpg

- title: Sea in a Palm
  title_cn: 掌中海
  caption: Chapter 2 key art — a child drifts past pairs of glowing doors, each offering one of two choices, while a hand of mist reaches over the sea.
  src: /assets/img/ch2-sea-in-a-palm.jpg
  thumb: /assets/img/ch2-sea-in-a-palm-960.jpg

- title: Silkworm in a Bottle
  title_cn: 瓶中蚕
  caption: Chapter 3 key art — a tunnel of woven silk and hanging cocoons opens onto a desert, where two robed riders cross toward a white city floating beyond a wall of glass.
  src: /assets/img/ch3-silkworm-in-a-bottle.jpg
  thumb: /assets/img/ch3-silkworm-in-a-bottle-960.jpg

- title: Temple in a Teapot
  title_cn: 壶中寺
  caption: Chapter 4 key art — glowing travellers climb a thousand steps toward a golden hall, while a hand of mist reaches for the gate, all beneath a cracked porcelain sky.
  src: /assets/img/ch4-temple-in-a-teapot-v2.jpg
  thumb: /assets/img/ch4-temple-in-a-teapot-v2-960.jpg

- title: House in a Box
  title_cn: 盒中屋
  caption: Chapter 5 key art — a masked household moves in chained pairs around a grave mound at sunset, inside a mansion that is itself inside a lacquered box.
  src: /assets/img/ch5-house-in-a-box.jpg
  thumb: /assets/img/ch5-house-in-a-box-960.jpg

- title: Scenery in a Bonsai
  title_cn: 盆中景
  caption: Chapter 6 key art — an old traveller walks through a sea of grass among nameless graves and discarded masks, the whole journey in miniature behind them, wildfire on the horizon.
  src: /assets/img/ch6-scenery-in-a-bonsai.jpg
  thumb: /assets/img/ch6-scenery-in-a-bonsai-960.jpg

- title: Rebirth in the Afterlife
  title_cn: 复往生
  caption: Chapter 7 key art — back at the bridge at dawn, the traveller holds up the finished Life Scroll as nine threads of light return, while everyone they met waits to cross.
  src: /assets/img/ch7-rebirth-in-the-afterlife.jpg
  thumb: /assets/img/ch7-rebirth-in-the-afterlife-960.jpg

- title: The Lantern Terrace
  title_cn: 灯台
  caption: Early mood concept — a temple terrace at dusk and a lantern holding a fragment of memory.
  src: /assets/img/concept-temple-lantern.jpg
  thumb: /assets/img/concept-temple-lantern-960.jpg
