# Gallery tiles, shown in this order.
# To add art: drop a full-size image (~1600–2000px wide JPG) and a ~960px thumbnail into /assets/img,
# then add an entry here. Entries with `placeholder: true` show as "in progress" tiles —
# replace them as real art arrives.
#
# Layout note (desktop, 3 columns): a `wide: true` tile takes 2×2 cells, others take 1.
# Keep the total cell count a multiple of 3 so the grid has no gaps.
# Current: wide(4) + 2 + wide(4) + 2 = 12 cells.

